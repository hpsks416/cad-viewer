<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>仿真器控制台</title>
<style>
  html, body { margin: 0; background: #141419; color: #e8e8ec;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { display: flex; gap: 14px; padding: 14px; min-height: 100vh; box-sizing: border-box; }
  .view { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .view img { width: 100%; background: #000; border: 1px solid #2c2c34; border-radius: 8px; }
  .bar { font-size: 12px; color: #8a8a94; }
  .panel { width: 380px; max-height: calc(100vh - 28px); overflow-y: auto; background: rgba(22,22,28,0.9);
    border: 1px solid #2c2c34; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group label { font-size: 12px; color: #c8c8d0; }
  .row { display: flex; gap: 6px; }
  button { cursor: pointer; border: 1px solid #2c2c34; background: #22222a; color: #e8e8ec;
    padding: 8px 10px; border-radius: 7px; font-size: 13px; flex: 1; }
  button:hover { background: #2c2c34; }
  button.fire { background: #c73b3b; border-color: #c73b3b; color: #fff; }
  button.fire:hover { background: #d64a4a; }
  input[type=range] { width: 100%; accent-color: #4d7cff; }
  input[type=number], input[type=text] { width: 100%; background: #1b1b20; border: 1px solid #2c2c34;
    color: #e8e8ec; border-radius: 6px; padding: 6px; font-size: 13px; box-sizing: border-box; }
  .val { color: #8a8a94; font-size: 11px; text-align: right; min-width: 52px; }
  .hint { font-size: 11px; color: #7a7a84; line-height: 1.5; }
  /* 配置面板 */
  .cfg { border: 1px solid #2c2c34; border-radius: 8px; overflow: hidden; }
  .cfg summary { cursor: pointer; padding: 7px 10px; background: #1b1b20; font-size: 12px; color: #c8c8d0; }
  .cfg-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .cfg-body input, .cfg-body select { width: 100%; background: #1b1b20; border: 1px solid #2c2c34;
    color: #e8e8ec; border-radius: 6px; padding: 5px; font-size: 12px; box-sizing: border-box; }
  .cfg-body input:disabled, .cfg-body select:disabled { opacity: 0.4; }
  .field-row { display: grid; grid-template-columns: 84px 1fr; gap: 6px; align-items: center; }
  .field-row label { font-size: 11px; color: #8a8a94; }
  .def-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #e0b34a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="view">
    <img id="stream" src="/stream" alt="相机画面" />
    <div class="bar">状态：<span id="status">连接中…</span></div>
  </div>

  <div class="panel">
    <h2>仿真器控制台</h2>

    <div class="row">
      <button onclick="window.open('/config.html','_blank')">打开节点式配置</button>
    </div>

    <div class="group">
      <div class="row">
        <button class="fire" data-cmd="FIRE">FIRE 射击</button>
        <button data-cmd="RESET">RESET 复位</button>
      </div>
      <div class="row">
        <button data-cmd="GYRO 1">小陀螺开</button>
        <button data-cmd="GYRO 0">小陀螺关</button>
      </div>
    </div>

    <div class="group">
      <label>云台 GIMBAL（弧度）</label>
      <div class="row"><label>yaw</label><input type="range" id="gy" min="-3.14" max="3.14" step="0.01" value="0" /><span class="val" id="gyv">0.00</span></div>
      <div class="row"><label>pitch</label><input type="range" id="gp" min="-1.4" max="1.4" step="0.01" value="0" /><span class="val" id="gpv">0.00</span></div>
      <button id="sendGimbal">发送云台</button>
    </div>

    <div class="group">
      <label>飞镖舵角 DART（弧度）</label>
      <div class="row"><label>pitch</label><input type="number" id="dp" step="0.01" value="0" /></div>
      <div class="row"><label>yaw</label><input type="number" id="dy" step="0.01" value="0" /></div>
      <div class="row"><label>roll</label><input type="number" id="dr" step="0.01" value="0" /></div>
      <button id="sendDart">发送舵角</button>
    </div>

    <div class="group">
      <label>七层配置（缺省 / 自定义）</label>
      <div id="configPanel"></div>
    </div>

    <div class="hint">先启动 daedalus 模拟器（7666 图像 / 7667 指令）。云台/舵角单位为弧度。配置改动即时写入 simulator-config.json。</div>
  </div>
</div>

<script>
async function send(cmd) {
  try {
    const r = await fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd }) });
    const d = await r.json();
    document.getElementById('status').textContent = d.ok ? ('已发送：' + d.cmd) : ('发送失败：' + d.msg);
  } catch (e) { document.getElementById('status').textContent = '发送失败：' + e.message; }
}
document.querySelectorAll('button[data-cmd]').forEach(b => b.addEventListener('click', () => send(b.dataset.cmd)));

const gy = document.getElementById('gy'), gp = document.getElementById('gp');
document.getElementById('gyv').textContent = '0.00'; document.getElementById('gpv').textContent = '0.00';
gy.addEventListener('input', () => document.getElementById('gyv').textContent = parseFloat(gy.value).toFixed(2));
gp.addEventListener('input', () => document.getElementById('gpv').textContent = parseFloat(gp.value).toFixed(2));
document.getElementById('sendGimbal').addEventListener('click', () => send(`GIMBAL ${gy.value} ${gp.value}`));
document.getElementById('sendDart').addEventListener('click', () => {
  send(`DART ${document.getElementById('dp').value} ${document.getElementById('dy').value} ${document.getElementById('dr').value}`);
});

// 链路状态轮询
setInterval(async () => {
  const st = document.getElementById('status');
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    const d = await r.json();
    if (d.connected) {
      st.textContent = `链路已连接 · 帧 #${d.seq} · gimbal yaw=${d.yaw.toFixed(3)} pitch=${d.pitch.toFixed(3)} rad · ${d.width}x${d.height}`;
      st.style.color = '#5ad08a';
    } else { st.textContent = '链路未连接（等待 daedalus 仿真器就绪…）'; st.style.color = '#e06c6c'; }
  } catch (e) { st.textContent = '桥接不可达'; st.style.color = '#e06c6c'; }
}, 500);

// ===== 七层配置面板 =====
const LAYERS = [
  { id: 'robot_model', title: '1 · 机器人模型', modes: [['glb', 'glb'], ['urdf', 'urdf']],
    fields: [['glb', 'text', 'glb 路径'], ['urdf', 'text', 'urdf 路径']] },
  { id: 'materials', title: '2 · 材质', modes: [['preset', '预设'], ['custom', '自定义']],
    fields: [['preset', 'select', '预设', [['carbon-fiber', '碳纤维'], ['aluminum-6061', '6061 铝'], ['plastic', '塑料']]]] },
  { id: 'joints', title: '3 · 关节', modes: [['joints-json', 'joints.json'], ['urdf', 'urdf']],
    fields: [['source', 'text', '来源路径']] },
  { id: 'fpv_camera', title: '4 · FPV 相机', modes: [['anchor-part', '锚点零件'], ['custom', '自定义']],
    fields: [['anchor_part', 'text', '锚点零件'], ['yaw', 'number', '偏航(rad)'], ['pitch', 'number', '俯仰(rad)']] },
  { id: 'computer_framework', title: '5 · 上下位机框架', modes: [['custom', '自定义']],
    fields: [['protocol', 'select', '协议', [['tcp', 'TCP'], ['udp', 'UDP'], ['shm', 'SHM']]], ['image_port', 'number', '图像端口'], ['command_port', 'number', '指令端口']] },
  { id: 'motion_controller', title: '6 · 运动控制器', modes: [['ideal', '理想'], ['custom', '自定义']],
    fields: [['chassis', 'select', '底盘', [['mecanum', '麦轮'], ['steering', '舵轮']]]] },
  { id: 'vision_algorithm', title: '7 · 视觉自瞄', modes: [['plugin', '插件']],
    fields: [['plugin', 'text', '插件名']] },
];

let cfg = {};
let saveTimer = null;

function saveConfig() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) }); } catch (e) {}
  }, 300);
}

function renderConfig() {
  const el = document.getElementById('configPanel');
  el.innerHTML = '';
  LAYERS.forEach(layer => {
    const det = document.createElement('details');
    det.className = 'cfg';
    const sum = document.createElement('summary');
    sum.textContent = layer.title;
    det.appendChild(sum);

    const body = document.createElement('div');
    body.className = 'cfg-body';
    const cur = cfg[layer.id] || {};
    const isDefault = cur.mode === 'default';

    // 「使用默认」开关
    const defToggle = document.createElement('label');
    defToggle.className = 'def-toggle';
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = isDefault;
    chk.addEventListener('change', () => {
      if (chk.checked) { cur.mode = 'default'; }
      else { cur.mode = cur.mode === 'default' || !cur.mode ? (layer.modes[0][0]) : cur.mode; }
      renderConfig();
      saveConfig();
    });
    defToggle.appendChild(chk);
    defToggle.appendChild(document.createTextNode(' 使用默认'));
    body.appendChild(defToggle);

    if (!isDefault) {
      // 模式下拉
      const modeRow = document.createElement('div');
      modeRow.className = 'field-row';
      const ml = document.createElement('label'); ml.textContent = '模式'; modeRow.appendChild(ml);
      const ms = document.createElement('select');
      layer.modes.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; ms.appendChild(o); });
      ms.value = cur.mode || layer.modes[0][0];
      ms.addEventListener('change', () => { cur.mode = ms.value; saveConfig(); });
      modeRow.appendChild(ms);
      body.appendChild(modeRow);

      // 字段
      layer.fields.forEach(([key, type, label, opts]) => {
        const row = document.createElement('div');
        row.className = 'field-row';
        const lab = document.createElement('label'); lab.textContent = label; row.appendChild(lab);
        let input;
        if (type === 'select') {
          input = document.createElement('select');
          (opts || []).forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; input.appendChild(o); });
        } else {
          input = document.createElement('input');
          input.type = type;
          if (type === 'number') input.step = 'any';
        }
        input.value = cur[key] != null ? cur[key] : '';
        input.addEventListener('change', () => { cur[key] = (type === 'number') ? parseFloat(input.value) : input.value; saveConfig(); });
        row.appendChild(input);
        body.appendChild(row);
      });
    }

    det.appendChild(body);
    el.appendChild(det);
  });
}

(async () => {
  try { cfg = await (await fetch('/api/config', { cache: 'no-store' })).json(); } catch (e) {}
  renderConfig();
})();
</script>
</body>
</html>
